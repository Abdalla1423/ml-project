[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dopfn"
version = "0.1.0"
description = "Replication and extension of Do-PFN (TU Berlin Project ML, WiSe 2026/27)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "networkx",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
# Only needed to convert the Do-PFN case-study pickles (scripts/generate_data.py case-studies).
case-studies = ["dill", "pandas", "scipy", "tqdm"]

# Installs our package `dopfn` and the copied Do-PFN-prior package `dopfnprior`
# (Do-PFN-prior/, see docs/third-party.md).
[tool.setuptools.packages.find]
where = ["src", "Do-PFN-prior"]
include = ["dopfn*", "dopfnprior*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "Do-PFN-prior", "tests"]
