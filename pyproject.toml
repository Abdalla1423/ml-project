[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dopfn"
version = "0.1.0"
description = "Replication and extension of Do-PFN (TU Berlin Project ML, WiSe 2026/27)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "networkx",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
