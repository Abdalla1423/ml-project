# Prior config (owner: A). Defaults from paper Appendix C / D.1, see docs/paper-notes.md.
seed: 0
n_nodes_max: 10            # v1: up to 10, v1.1: up to 60
nonlinearities: [square, relu, tanh]
root_noise_std: [1.0, 3.0]  # sigma_exo ~ U[1, 3]
noise_scale: 0.3            # sigma_eps = 0.3 * beta
noise_beta: [1.0, 5.0]      # beta ~ Beta(1, 5)
m_min: 10
m_max: 2200
